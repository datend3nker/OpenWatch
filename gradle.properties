# The release version, read by app/ and wear/ (one listing, one release). The
# phone app ships versionCode N, the watch 2000000000 + N. scripts/release.sh
# patches these two lines; the pipeline overrides them per build with
# OPENWATCH_VERSION_CODE / OPENWATCH_VERSION_NAME.
openwatch.versionCode=8
openwatch.versionName=0.3.0
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
# Task outputs are reused across builds. In CI, gradle/actions/setup-gradle keeps
# the cache directory between runs, so a release build of a commit main already
# verified restores its test and lint results instead of redoing them.
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.uniquePackageNames=false
android.dependency.useConstraints=false
android.disallowKotlinSourceSets=false
